name: Go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
      - name: Ensure committed frontend assets are up to date
        run: git diff --exit-code -- web/static/dist/assets/main.js web/static/dist/assets/main.css
      - name: Test (race detector)
        run: go test -race ./...
      - name: Build standalone Go binary
        run: CGO_ENABLED=0 go build -o /tmp/go-shorty ./cmd/server

  tenant-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shorty
          POSTGRES_PASSWORD: shorty
          POSTGRES_DB: shorty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shorty -d shorty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify atomic legacy link rekey with PostgreSQL
        env:
          PGPASSWORD: shorty
        run: |
          set -euo pipefail
          db="postgresql://shorty:shorty@127.0.0.1:5432/shorty?sslmode=disable"
          for file in migrations/000*.sql; do
            sed '/^-- +goose Down/,$d' "$file" | psql "$db" -v ON_ERROR_STOP=1
          done
          psql "$db" -v ON_ERROR_STOP=1 -c "INSERT INTO links (tenant_id,code,long_url) VALUES ('a-b-com','abc1234','https://example.com/')"
          psql "$db" -v ON_ERROR_STOP=1 -c "INSERT INTO clicks (tenant_id,code) VALUES ('a-b-com','abc1234')"
          psql "$db" -v ON_ERROR_STOP=1 -v code=abc1234 -v legacy_tenant=a-b-com -v new_tenant=domain:a.b.com -f scripts/rekey-link.sql
          result=$(psql "$db" -tA -v ON_ERROR_STOP=1 -c "SELECT l.tenant_id || '/' || c.tenant_id FROM links l JOIN clicks c USING (code) WHERE code = 'abc1234'")
          test "$result" = "domain:a.b.com/domain:a.b.com"
      - name: Integration test: dedupe, collisions and bounded click history
        env:
          SHORTY_TEST_DATABASE_URL: postgres://shorty:shorty@127.0.0.1:5432/shorty?sslmode=disable
        run: go test ./internal/store/postgres -run TestPostgresDedupeCollisionAndClickRetention -count=1 -v
