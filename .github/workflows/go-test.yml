name: Go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
      - name: Ensure committed frontend assets are up to date
        run: git diff --exit-code -- web/static/dist/assets/main.js web/static/dist/assets/main.css
      - name: Test (race detector)
        run: go test -race ./...
      - name: Build standalone Go binary
        run: CGO_ENABLED=0 go build -o /tmp/go-shorty ./cmd/server
